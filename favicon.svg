<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="1" y="1" width="30" height="30" rx="7" ry="7" fill="#0F0F23"/>
  <!-- Robot head outline -->
  <rect x="7" y="10" width="18" height="14" rx="3" ry="3" fill="none" stroke="url(#g)" stroke-width="1.8"/>
  <!-- Eyes -->
  <circle cx="13" cy="16" r="2.2" fill="#6C5CE7"/>
  <circle cx="19" cy="16" r="2.2" fill="#00D2FF"/>
  <!-- Eye glints -->
  <circle cx="13.7" cy="15.3" r="0.6" fill="#fff" opacity="0.8"/>
  <circle cx="19.7" cy="15.3" r="0.6" fill="#fff" opacity="0.8"/>
  <!-- Mouth -->
  <rect x="12" y="20" width="8" height="1.4" rx="0.7" fill="url(#g)"/>
  <!-- Antenna -->
  <line x1="16" y1="10" x2="16" y2="5.5" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="4.5" r="1.8" fill="#00D2FF"/>
  <!-- Ear nodes -->
  <circle cx="5" cy="17" r="1.5" fill="#6C5CE7"/>
  <circle cx="27" cy="17" r="1.5" fill="#00D2FF"/>
</svg>
