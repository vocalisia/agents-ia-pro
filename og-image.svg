<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F23"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative gradient bar top -->
  <rect width="1200" height="6" fill="url(#accent)"/>
  <!-- Robot icon large -->
  <g transform="translate(80, 160) scale(8)">
    <rect x="7" y="10" width="18" height="14" rx="3" ry="3" fill="none" stroke="url(#accent)" stroke-width="1.8"/>
    <circle cx="13" cy="16" r="2.2" fill="#6C5CE7"/>
    <circle cx="19" cy="16" r="2.2" fill="#00D2FF"/>
    <circle cx="13.7" cy="15.3" r="0.6" fill="#fff" opacity="0.8"/>
    <circle cx="19.7" cy="15.3" r="0.6" fill="#fff" opacity="0.8"/>
    <rect x="12" y="20" width="8" height="1.4" rx="0.7" fill="url(#accent)"/>
    <line x1="16" y1="10" x2="16" y2="5.5" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="16" cy="4.5" r="1.8" fill="#00D2FF"/>
    <circle cx="5" cy="17" r="1.5" fill="#6C5CE7"/>
    <circle cx="27" cy="17" r="1.5" fill="#00D2FF"/>
  </g>
  <!-- Main title -->
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="middle">Agents-IA.pro</text>
  <!-- Gradient underline -->
  <rect x="350" y="255" width="500" height="4" rx="2" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#a0a0c0" text-anchor="middle">La Marketplace #1 d'Agents IA Francophones</text>
  <!-- Stats row -->
  <text x="300" y="430" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#6C5CE7" text-anchor="middle">+500</text>
  <text x="300" y="465" font-family="Arial, sans-serif" font-size="18" fill="#8080a0" text-anchor="middle">Agents IA vérifiés</text>
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#00D2FF" text-anchor="middle">12 840+</text>
  <text x="600" y="465" font-family="Arial, sans-serif" font-size="18" fill="#8080a0" text-anchor="middle">Utilisateurs actifs</text>
  <text x="900" y="430" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#6C5CE7" text-anchor="middle">98%</text>
  <text x="900" y="465" font-family="Arial, sans-serif" font-size="18" fill="#8080a0" text-anchor="middle">Satisfaction client</text>
  <!-- Bottom URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="22" fill="#606080" text-anchor="middle">agents-ia.pro</text>
</svg>
